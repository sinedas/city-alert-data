name: Validate content (stage)

# Runs content Vitest suite on every push to `stage`.
# On failure, emails NOTIFY_MAIL_TO via SMTP secrets.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   SMTP_USER        e.g. info@citymission.lt
#   SMTP_PASS        mailbox password
#   NOTIFY_MAIL_TO   e.g. sinedas@gmail.com
#
# Optional overrides (default = Hostinger):
#   SMTP_HOST   default smtp.hostinger.com
#   SMTP_PORT   default 587

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # secrets cannot be referenced in `if:` — map to env first
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_MAIL_TO: ${{ secrets.NOTIFY_MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # package-lock.json is gitignored in this repo
        run: npm install

      - name: Run content validation tests
        run: npm test

      - name: Send failure email
        if: failure() && env.SMTP_PASS != '' && env.NOTIFY_MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_HOST != '' && env.SMTP_HOST || 'smtp.hostinger.com' }}
          server_port: ${{ env.SMTP_PORT != '' && env.SMTP_PORT || 587 }}
          secure: false
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASS }}
          subject: "[city-alert-data] stage validation FAILED — ${{ github.sha }}"
          to: ${{ env.NOTIFY_MAIL_TO }}
          from: City Alert Data CI <${{ env.SMTP_USER }}>
          body: |
            Content validation failed on branch stage.

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Open the workflow run log for details.
